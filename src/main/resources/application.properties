spring.application.name=api

# Nome da Aplicação
# spring.application.name=api-raizes-do-nordeste

# Configuração do Banco de Dados H2 em Memória
spring.datasource.url=jdbc:h2:mem:raizesdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Habilita o Console Visual do H2 no Navegador (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Atualiza a estrutura de tabelas automaticamente no banco baseado nas nossas Entidades JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true